{% extends "base.html" %}

{% block main_content %}

<h2>Login</h2>

<form method="POST">
{{ form.hidden_tag() }}


{% if next %}
<input type="hidden" name="next" value="{{ next }}">
{% endif %}

<p>
{{ form.user_id.label }}<br>
{{ form.user_id() }}
</p>

<p>
{{ form.password.label }}<br>
{{ form.password() }}
</p>

<p>{{ form.submit() }}</p>

</form>
<p>
    <a href="{{ url_for('index') }}" class="nav-button">Back to Homepage</a>
    <a href="{{ url_for('register') }}" class="nav-button">Don't have an Account? Register.</a>
</p>

{% endblock %}
